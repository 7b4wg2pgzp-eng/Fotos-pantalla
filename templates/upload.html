<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040306">
<title>Álbum Interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600&family=Manrope:wght@400;500;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --noir:#040306;
    --gold:#d9a441;
    --gold-lit:#f6e0a4;
    --gold-deep:#8a6118;
    --bone:#f4efe4;
    --muted:rgba(240,233,219,.80);
    --line:rgba(217,164,65,.20);
    --panel:rgba(0,0,0,.55);
    --ease:cubic-bezier(.22,.8,.28,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(217,164,65,.16), transparent 58%),
      radial-gradient(ellipse at 50% 110%, rgba(217,164,65,.07), transparent 55%),
      var(--noir);
    background-attachment:fixed;
    color:var(--bone);
    font-family:'Manrope', system-ui, sans-serif;
    padding:38px 22px 48px;
  }
  .card{ width:100%; max-width:430px; margin:0 auto; text-align:center; }

  .eyebrow{
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:.34em;
    font-size:13px;
    color:var(--gold-lit);
    margin:0 0 14px;
    text-shadow:0 2px 10px rgba(0,0,0,.9);
  }
  h1{
    font-family:'Anton','Arial Narrow',Impact,sans-serif;
    font-weight:400;
    font-size:clamp(30px, 8vw, 50px);
    line-height:.98;
    letter-spacing:.02em;
    text-transform:uppercase;
    margin:0 0 18px;
    background:linear-gradient(178deg,#fffaf0 6%,#ffeec4 28%,var(--gold-lit) 52%,#dfae55 76%,#ffeec2 98%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.85)) drop-shadow(0 10px 26px rgba(0,0,0,.85));
  }
  .hr{
    width:min(70vw,300px); height:1px; margin:0 auto 20px;
    background:linear-gradient(90deg,transparent,var(--gold-lit),transparent);
  }
  p.lead{
    color:var(--muted); font-size:15px; line-height:1.55;
    margin:0 0 30px; text-shadow:0 2px 10px rgba(0,0,0,.9);
  }

  .pill{
    display:inline-flex; align-items:center; justify-content:center; gap:11px;
    font-family:'Anton','Arial Narrow',Impact,sans-serif;
    text-transform:uppercase; letter-spacing:.06em;
    font-size:clamp(17px, 4.6vw, 22px); line-height:1;
    border:none; text-decoration:none; color:#160f04;
    background:linear-gradient(160deg,#fff6de,var(--gold-lit) 30%,var(--gold) 62%,#b98526);
    padding:19px 34px; border-radius:100px; cursor:pointer;
    box-shadow:0 10px 26px rgba(217,164,65,.18), inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .35s var(--ease), box-shadow .35s var(--ease);
  }
  .pill:active{ transform:scale(.97); }
  .pill svg{ width:22px; height:22px; }
  .pill.full{ width:100%; }
  .pill:disabled{
    opacity:.38; cursor:default; box-shadow:none;
    animation:none; transform:none;
  }
  #pickBtn{ animation:latido 3.2s ease-in-out 1.4s infinite; }
  @keyframes latido{
    0%,100%{transform:scale(1)}
    8%{transform:scale(1.035)}
    16%{transform:scale(1)}
  }

  input[type=file]{ display:none; }
  .preview{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:24px 0 6px; }
  .preview img{
    width:100%; aspect-ratio:1; object-fit:cover;
    border-radius:8px; border:1px solid var(--line);
  }

  .divider{
    display:flex; align-items:center; gap:14px;
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase; letter-spacing:.3em; font-size:12px;
    color:var(--muted); margin:30px 0 22px;
  }
  .divider::before, .divider::after{
    content:""; flex:1; height:1px;
    background:linear-gradient(90deg,transparent,rgba(217,164,65,.45),transparent);
  }

  .field{ text-align:left; margin-bottom:16px; }
  .field label{
    display:block;
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase; letter-spacing:.18em; font-size:13px;
    color:var(--gold); margin-bottom:8px;
  }
  .field input, .field textarea{
    width:100%; padding:14px 15px;
    background:linear-gradient(160deg,rgba(44,31,9,.55),var(--panel) 78%);
    background-color:#120d05;
    border:1px solid var(--line); border-radius:14px;
    color:var(--bone);
    -webkit-text-fill-color:var(--bone);
    font-family:'Manrope', sans-serif; font-size:16px;
    resize:none; transition:border-color .3s var(--ease);
    -webkit-appearance:none; appearance:none;
  }
  .field input::placeholder, .field textarea::placeholder{
    color:rgba(240,233,219,.34);
    -webkit-text-fill-color:rgba(240,233,219,.34);
    opacity:1;
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--gold); }
  .counter{
    font-family:'Barlow Condensed', sans-serif; letter-spacing:.12em;
    font-size:12px; color:var(--muted); text-align:right; margin-top:6px;
  }

  .status{
    min-height:22px; margin-top:18px; font-size:14px;
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase; letter-spacing:.16em; color:var(--muted);
  }
  .status.ok{ color:var(--gold-lit); }
  .status.err{ color:#e2a08c; }

  .firma{
    margin-top:44px;
    padding-top:30px;
    border-top:1px solid rgba(217,164,65,.16);
  }
  .firma__logo{
    width:min(300px, 80vw);
    height:auto;
    display:block;
    margin:0 auto;
  }
  @media (prefers-reduced-motion: reduce){
    #pickBtn{ animation:none; }
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Muro de fotos en vivo</p>
    <h1>Álbum Interactivo</h1>
    <div class="hr"></div>
    <p class="lead">Sumá tus fotos y dejá tu saludo. Aparecen en la pantalla de la fiesta.</p>

    <button type="button" class="pill" id="pickBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M4 8a2 2 0 0 1 2-2h2l1.2-1.8A2 2 0 0 1 10.8 3h2.4a2 2 0 0 1 1.6 1.2L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/>
        <circle cx="12" cy="12.5" r="3.3"/>
      </svg>
      Elegir fotos
    </button>

    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="preview" id="preview"></div>

    <div class="divider">y / o</div>

    <div class="field">
      <label for="nombre">Tu nombre</label>
      <input type="text" id="nombre" maxlength="40" placeholder="Opcional">
    </div>

    <div class="field">
      <label for="mensaje">Tu saludo</label>
      <textarea id="mensaje" rows="3" maxlength="280" placeholder="Opcional"></textarea>
      <div class="counter"><span id="count">0</span> / 280</div>
    </div>

    <button type="button" class="pill full" id="sendBtn" disabled>Enviar</button>
    <div class="status" id="status" role="status"></div>

    <div class="firma">
      <img src="/static/logo-davinci-electromet.png"
           alt="Da Vinci Festa · ElectroMet Servicios Audiovisuales"
           class="firma__logo">
    </div>
  </div>

<script>
  const pickBtn = document.getElementById('pickBtn');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const sendBtn = document.getElementById('sendBtn');
  const status = document.getElementById('status');
  const nombreEl = document.getElementById('nombre');
  const mensajeEl = document.getElementById('mensaje');
  const countEl = document.getElementById('count');
  let selected = [];

  function refreshSendState() {
    sendBtn.disabled = selected.length === 0 && mensajeEl.value.trim() === '';
  }

  pickBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    selected = Array.from(fileInput.files);
    preview.innerHTML = '';
    selected.slice(0, 8).forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });
    status.className = 'status';
    status.textContent = selected.length
      ? `${selected.length} foto${selected.length > 1 ? 's' : ''} lista${selected.length > 1 ? 's' : ''}`
      : '';
    refreshSendState();
  });

  mensajeEl.addEventListener('input', () => {
    countEl.textContent = mensajeEl.value.length;
    refreshSendState();
  });

  sendBtn.addEventListener('click', async () => {
    if (sendBtn.disabled) return;
    sendBtn.disabled = true;
    status.className = 'status';
    status.textContent = 'Enviando...';

    const form = new FormData();
    selected.forEach(f => form.append('photos', f));
    form.append('nombre', nombreEl.value);
    form.append('mensaje', mensajeEl.value);

    try {
      const res = await fetch('/api/upload', { method: 'POST', body: form });
      const data = await res.json();
      if (data.ok) {
        status.className = 'status ok';
        status.textContent = 'Listo · ya está en pantalla';
        selected = [];
        preview.innerHTML = '';
        fileInput.value = '';
        mensajeEl.value = '';
        countEl.textContent = '0';
      } else {
        throw new Error(data.error || 'error');
      }
    } catch (e) {
      status.className = 'status err';
      status.textContent = 'No se pudo enviar · probá de nuevo';
    }
    refreshSendState();
  });
</script>
</body>
</html>
