<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ event_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#150F1F;
    --gold:#E8C468;
    --magenta:#FF3E8E;
    --text:#F5F0FA;
    --muted:#9384AC;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,62,142,0.18), transparent 55%),
      radial-gradient(circle at 15% 90%, rgba(232,196,104,0.10), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{ width:100%; max-width:420px; text-align:center; }
  .eyebrow{
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px;
  }
  h1{
    font-family:'Unbounded', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 7vw, 38px);
    line-height:1.15;
    margin:0 0 12px;
    background:linear-gradient(120deg, var(--gold), var(--magenta));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  p.sub{ color:var(--muted); font-size:15px; margin:0 0 32px; }
  .shutter-wrap{ position:relative; display:inline-block; margin-bottom:22px; }
  .shutter-glow{
    position:absolute; inset:-18px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,62,142,0.45), transparent 70%);
    filter:blur(6px);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(0.92); opacity:.7;}
    50%{transform:scale(1.05); opacity:1;}
  }
  .shutter{
    position:relative; width:132px; height:132px; border-radius:50%;
    border:none;
    background:linear-gradient(145deg, var(--magenta), #C4207A);
    color:#fff;
    font-family:'Unbounded', sans-serif;
    font-weight:600; font-size:14px; letter-spacing:.02em;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 12px 30px rgba(255,62,142,0.35);
    transition:transform .15s ease;
  }
  .shutter:active{ transform:scale(0.95); }
  .shutter-label{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .shutter-label svg{ width:34px; height:34px; }
  input[type=file]{ display:none; }
  .preview{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
    margin:0 0 20px;
  }
  .preview img{
    width:100%; aspect-ratio:1; object-fit:cover;
    border-radius:10px; border:1px solid rgba(255,255,255,0.08);
  }
  .send{
    width:100%; padding:16px; border:none; border-radius:14px;
    background:var(--gold); color:#241704;
    font-family:'Manrope', sans-serif; font-weight:700; font-size:16px;
    cursor:pointer;
    transition:opacity .15s ease, transform .15s ease;
  }
  .send:disabled{ opacity:.4; cursor:default; }
  .send:active:not(:disabled){ transform:scale(0.98); }
  .status{ min-height:22px; margin-top:16px; font-size:14px; color:var(--muted); }
  .status.ok{ color:var(--gold); }
  .status.err{ color:var(--magenta); }
  .status:focus{ outline:2px solid var(--gold); }
  @media (prefers-reduced-motion: reduce){
    .shutter-glow{ animation:none; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Muro de fotos en vivo</div>
    <h1>{{ event_name }}</h1>
    <p class="sub">Elegí tus fotos del celular y sumalas a la pantalla de la fiesta.</p>

    <div class="shutter-wrap">
      <div class="shutter-glow"></div>
      <button type="button" class="shutter" id="pickBtn" aria-label="Elegir fotos">
        <span class="shutter-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 8a2 2 0 0 1 2-2h2l1.2-1.8A2 2 0 0 1 10.8 3h2.4a2 2 0 0 1 1.6 1.2L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/>
            <circle cx="12" cy="12.5" r="3.3"/>
          </svg>
          Elegir fotos
        </span>
      </button>
    </div>

    <input type="file" id="fileInput" accept="image/*" multiple>

    <div class="preview" id="preview"></div>

    <button type="button" class="send" id="sendBtn" disabled>Subir fotos</button>
    <div class="status" id="status" role="status"></div>
  </div>

<script>
  const pickBtn = document.getElementById('pickBtn');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const sendBtn = document.getElementById('sendBtn');
  const status = document.getElementById('status');
  let selected = [];

  pickBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    selected = Array.from(fileInput.files);
    preview.innerHTML = '';
    selected.slice(0, 8).forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });
    sendBtn.disabled = selected.length === 0;
    status.className = 'status';
    status.textContent = selected.length
      ? `${selected.length} foto${selected.length > 1 ? 's' : ''} lista${selected.length > 1 ? 's' : ''}`
      : '';
  });

  sendBtn.addEventListener('click', async () => {
    if (!selected.length) return;
    sendBtn.disabled = true;
    status.className = 'status';
    status.textContent = 'Subiendo...';

    const form = new FormData();
    selected.forEach(f => form.append('photos', f));

    try {
      const res = await fetch('/api/upload', { method: 'POST', body: form });
      const data = await res.json();
      if (data.ok) {
        status.className = 'status ok';
        status.textContent = '¡Listo! Ya están en la pantalla 🎉';
        selected = [];
        preview.innerHTML = '';
        fileInput.value = '';
      } else {
        throw new Error(data.error || 'error');
      }
    } catch (e) {
      status.className = 'status err';
      status.textContent = 'No se pudo subir. Probá de nuevo.';
      sendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
