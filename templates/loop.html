<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{ event_name }} — Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --noir:#040306;
    --gold:#d9a441;
    --gold-lit:#f6e0a4;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
        background:transparent;
    overflow:hidden;
  }
  .stage{ position:relative; width:100vw; height:100vh; }
  .slide{
    position:absolute; inset:0;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    opacity:0;
    transition:opacity 1.5s ease;
  }
  .slide.active{ opacity:1; }
  .clip{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    background:transparent;
    display:none;
  }
  .clip.playing{
    display:block;
    box-shadow:inset 0 0 0 12px rgba(217,164,65,.9);
  }
  .vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(217,164,65,.07), transparent 60%);
  }
  .empty{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:.34em;
    font-size:20px;
    color:rgba(246,224,164,.34);
  }
  @media (prefers-reduced-motion: reduce){
    .slide{ transition:none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="empty" id="empty">Esperando fotos</div>
    <video class="clip" id="clip" muted playsinline preload="none"></video>
    <div class="vignette"></div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const emptyMsg = document.getElementById('empty');
  const clip = document.getElementById('clip');
  const HOLD_MS = 25000;
  const FETCH_EVERY_MS = 8000;
  const VIDEO_CAP_S = {{ video_max_seconds }};

  let items = [];
  let index = 0;
  let slideEls = [];
  let timer = null;
  let playingVideo = false;
  let currentKey = null;
  let clipToken = 0;
  let started = false;
  const skipped = new Set();

  function itemKey(item) {
    return item.kind + ':' + (item.uid || item.src);
  }

  function validItem(item) {
    if (!item || typeof item.src !== 'string') return false;
    if (item.kind === 'photo') return /^\/photos\/[0-9a-f]{32}\.jpg$/i.test(item.src);
    return item.kind === 'video'
      && /^[0-9a-f]{32}$/.test(item.uid || '')
      && item.src === '/videos/' + item.uid
      && typeof item.mime === 'string';
  }

  function schedule(ms) {
    clearTimeout(timer);
    timer = setTimeout(advance, ms);
  }

  function stopClip() {
    clip.onended = null;
    clip.onerror = null;
    clip.ontimeupdate = null;
    clip.onplaying = null;
    clip.pause();
    while (clip.firstChild) clip.removeChild(clip.firstChild);
    clip.removeAttribute('src');
    try { clip.load(); } catch (error) { /* el navegador ya soltó el video */ }
    clip.classList.remove('playing');
  }

  function playClip(item) {
    clearTimeout(timer);
    const token = ++clipToken;
    playingVideo = true;
    currentKey = itemKey(item);
    stopClip();
    playingVideo = true;
    // load() del corte anterior puede disparar un error en otro turno.
    // Los handlers del video nuevo se enganchan después de ese turno.
    setTimeout(() => {
      if (token !== clipToken) return;
      clip.muted = true;
      clip.classList.add('playing');
      const source = document.createElement('source');
      source.src = item.src;
      source.type = item.mime;
      clip.appendChild(source);
      let watchdog = setTimeout(() => finish('stall'), 45000);
      function finish(reason) {
        if (token !== clipToken) return;
        clipToken += 1;
        clearTimeout(watchdog);
        playingVideo = false;
        stopClip();
        if (reason === 'decode') skipped.add(item.uid);
        schedule(reason === 'ended' || reason === 'cap' ? 600 : HOLD_MS);
      }
      clip.onended = () => finish('ended');
      clip.onerror = () => {
        const code = clip.error ? clip.error.code : 0;
        finish(code === 3 || code === 4 ? 'decode' : 'stall');
      };
      clip.ontimeupdate = () => {
        if (clip.currentTime >= VIDEO_CAP_S) finish('cap');
      };
      clip.onplaying = () => clearTimeout(watchdog);
      clip.load();
      const pending = clip.play();
      if (pending && pending.catch) pending.catch(() => finish('stall'));
    }, 0);
  }

  function showItem(item) {
    currentKey = itemKey(item);
    emptyMsg.style.display = 'none';
    if (item.kind === 'video') {
      slideEls.forEach(el => el.classList.remove('active'));
      playClip(item);
      return;
    }
    clipToken += 1;
    playingVideo = false;
    stopClip();
    slideEls.forEach(el => el.classList.remove('active'));
    const el = slideEls.find(slide => slide.dataset.src === item.src);
    if (!el) {
      schedule(HOLD_MS);
      return;
    }
    void el.offsetWidth;
    el.classList.add('active');
    schedule(HOLD_MS);
  }

  function advance() {
    const playable = items.filter(item => item.kind !== 'video' || !skipped.has(item.uid));
    if (!playable.length) {
      emptyMsg.style.display = 'flex';
      schedule(HOLD_MS);
      return;
    }
    if (index >= playable.length) index = 0;
    const item = playable[index];
    index = (index + 1) % playable.length;
    showItem(item);
  }

  function rebuildSlides() {
    slideEls.forEach(el => el.remove());
    const photos = items.filter(item => item.kind === 'photo');
    slideEls = photos.map(item => {
      const el = document.createElement('div');
      el.className = 'slide';
      el.dataset.src = item.src;
      el.style.backgroundImage = `url("${item.src}")`;
      stage.insertBefore(el, clip);
      return el;
    });
    emptyMsg.style.display = items.length ? 'none' : 'flex';
  }

  async function refreshItems() {
    try {
      const res = await fetch('/api/loop-items', { cache: 'no-store' });
      const data = await res.json();
      if (!Array.isArray(data.items)) return;
      const next = data.items.filter(validItem).filter(item => item.kind !== 'video' || !skipped.has(item.uid));
      if (JSON.stringify(next) === JSON.stringify(items)) return;
      const key = currentKey;
      items = next;
      rebuildSlides();
      if (playingVideo && key && !items.some(item => itemKey(item) === key)) {
        clipToken += 1;
        playingVideo = false;
        stopClip();
        index = 0;
        schedule(0);
        return;
      }
      if (key) {
        const at = items.findIndex(item => itemKey(item) === key);
        if (at >= 0) index = (at + 1) % items.length;
      }
      if (!started && items.length && !playingVideo) {
        started = true;
        schedule(0);
      }
    } catch (e) { /* silencioso */ }
  }

  refreshItems();
  setInterval(refreshItems, FETCH_EVERY_MS);
  schedule(HOLD_MS);
</script>
</body>
</html>
