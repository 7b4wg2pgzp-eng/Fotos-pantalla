<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{ event_name }} — Loop</title>
<style>
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#0A0710;
    overflow:hidden;
  }
  .stage{ position:relative; width:100vw; height:100vh; }
  .slide{
    position:absolute; inset:0;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    opacity:0;
    transition:opacity 1.5s ease;
  }
  .slide.active{
    opacity:1;
  }
  .vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background:radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  .empty{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#5c4f74;
    font-family:sans-serif;
    font-size:20px;
    letter-spacing:.05em;
  }
  @media (prefers-reduced-motion: reduce){
    .slide{ transition:none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="empty" id="empty">Esperando fotos…</div>
    <div class="vignette"></div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const emptyMsg = document.getElementById('empty');
  const HOLD_MS = 25000;
  const FETCH_EVERY_MS = 8000;

  let photos = [];
  let index = 0;
  let slideEls = [];

  async function refreshPhotos() {
    try {
      const res = await fetch('/api/photos', { cache: 'no-store' });
      const data = await res.json();
      if (JSON.stringify(data.photos) !== JSON.stringify(photos)) {
        photos = data.photos;
        rebuildSlides();
      }
    } catch (e) { /* silencioso: sigue mostrando lo que ya tiene */ }
  }

  function rebuildSlides() {
    slideEls.forEach(el => el.remove());
    const vignette = stage.querySelector('.vignette');
    slideEls = photos.map(src => {
      const el = document.createElement('div');
      el.className = 'slide';
      el.style.backgroundImage = `url("${src}")`;
      stage.insertBefore(el, vignette);
      return el;
    });
    emptyMsg.style.display = photos.length ? 'none' : 'flex';
    index = Math.min(index, Math.max(photos.length - 1, 0));
  }

  function showNext() {
    if (!slideEls.length) return;
    slideEls.forEach(el => el.classList.remove('active'));
    const el = slideEls[index];
    void el.offsetWidth; // fuerza el reinicio del fundido
    el.classList.add('active');
    index = (index + 1) % slideEls.length;
  }

  refreshPhotos();
  setInterval(refreshPhotos, FETCH_EVERY_MS);
  setInterval(showNext, HOLD_MS);
</script>
</body>
</html>
