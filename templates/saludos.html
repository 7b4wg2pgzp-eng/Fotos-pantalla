<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{ event_name }} — Saludos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --gold:#d9a441;
    --gold-lit:#f6e0a4;
    --bone:#f4efe4;
    --line:rgba(217,164,65,.20);
    --panel:rgba(0,0,0,.55);
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent;
    overflow:hidden;
  }
  .stage{
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:6vh 8vw;
    box-sizing:border-box;
  }
  .card{
    position:absolute;
    width:fit-content;
    max-width:min(1100px, 84vw);
    text-align:center;
    opacity:0;
    transition:opacity 1.2s ease;

    padding:clamp(30px, 4.2vw, 58px) clamp(34px, 5.2vw, 74px);
    background:linear-gradient(160deg, rgba(44,31,9,.66), var(--panel) 76%);
    -webkit-backdrop-filter:blur(7px);
    backdrop-filter:blur(7px);
    border:1px solid rgba(217,164,65,.55);
    border-radius:26px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      0 18px 60px rgba(0,0,0,.62),
      0 0 80px rgba(217,164,65,.14);
  }
  .card.active{ opacity:1; }

  .quote{
    font-family:'Playfair Display', Georgia, serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(28px, 4.1vw, 58px);
    line-height:1.34;
    color:var(--bone);
    margin:0;
    text-shadow:0 3px 20px rgba(0,0,0,.75);
  }
  .quote::before{ content:"\201C"; color:var(--gold); }
  .quote::after{ content:"\201D"; color:var(--gold); }

  .rule{
    width:110px; height:1px;
    margin:clamp(22px, 2.8vh, 36px) auto clamp(15px, 1.9vh, 23px);
    background:linear-gradient(90deg, transparent, var(--gold-lit), transparent);
    box-shadow:0 0 18px 1px rgba(217,164,65,.45);
  }
  .autor{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.26em;
    font-size:clamp(15px, 1.7vw, 25px);
    color:var(--gold-lit);
    text-shadow:0 2px 12px rgba(0,0,0,.8);
  }

  .empty{
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:.34em;
    color:rgba(246,224,164,.30);
    font-size:20px;
  }
  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="empty" id="empty">Esperando saludos</div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const emptyMsg = document.getElementById('empty');
  const HOLD_MS = 18000;
  const FETCH_EVERY_MS = 8000;

  let mensajes = [];
  let index = 0;
  let cardEls = [];

  async function refreshMensajes() {
    try {
      const res = await fetch('/api/mensajes', { cache: 'no-store' });
      const data = await res.json();
      if (JSON.stringify(data.mensajes) !== JSON.stringify(mensajes)) {
        mensajes = data.mensajes;
        rebuildCards();
      }
    } catch (e) { /* silencioso */ }
  }

  function rebuildCards() {
    cardEls.forEach(el => el.remove());
    cardEls = mensajes.map(m => {
      const card = document.createElement('div');
      card.className = 'card';

      const quote = document.createElement('p');
      quote.className = 'quote';
      quote.textContent = m.texto;
      card.appendChild(quote);

      if (m.nombre) {
        const rule = document.createElement('div');
        rule.className = 'rule';
        card.appendChild(rule);

        const autor = document.createElement('div');
        autor.className = 'autor';
        autor.textContent = m.nombre;
        card.appendChild(autor);
      }

      stage.appendChild(card);
      return card;
    });
    emptyMsg.style.display = mensajes.length ? 'none' : 'block';
    index = Math.min(index, Math.max(mensajes.length - 1, 0));
  }

  function showNext() {
    if (!cardEls.length) return;
    cardEls.forEach(el => el.classList.remove('active'));
    const el = cardEls[index];
    void el.offsetWidth;
    el.classList.add('active');
    index = (index + 1) % cardEls.length;
  }

  refreshMensajes();
  setInterval(refreshMensajes, FETCH_EVERY_MS);
  setInterval(showNext, HOLD_MS);
</script>
</body>
</html>
