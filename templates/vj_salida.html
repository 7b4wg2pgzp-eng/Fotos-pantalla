<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title></title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #frame { position: absolute; inset: 0; background: #000; }
  #frame.boxed {
    inset: auto; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    border-style: solid;
    border-color: rgb(232, 196, 104);
  }
  video { display: block; width: 100%; height: 100%; background: #000; object-fit: contain; }
  #frame.boxed video { object-fit: fill; }
</style>
</head>
<body>
  <div id="frame"><video id="salida" muted playsinline autoplay></video></div>
<script src="/static/screen_loop_videos.js"></script>
<script>
  const opts = window.screenLoopVideos.outputOptions(location.search);
  const video = document.getElementById('salida');
  const frame = document.getElementById('frame');
  video.muted = !opts.audio;
  let seen = '';

  function fit() {
    if (!opts.marco || !video.videoWidth || !video.videoHeight) return;
    const box = window.screenLoopVideos.frameBox(
      video.videoWidth, video.videoHeight, window.innerWidth, window.innerHeight
    );
    frame.classList.add('boxed');
    frame.style.width = box.width + 'px';
    frame.style.height = box.height + 'px';
    frame.style.borderWidth = box.borderWidth + 'px';
  }

  function clearVideo() {
    video.pause();
    video.removeAttribute('src');
    try { video.load(); } catch (error) { /* la salida queda en negro */ }
  }

  async function poll() {
    try {
      const res = await fetch('/vj/estado' + location.search, { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      const key = String(data.rev) + ':' + data.mode + ':' + (data.uid || '');
      if (key === seen) return;
      seen = key;
      if (data.mode === 'stop' || !/^[0-9a-f]{32}$/.test(data.uid || '')) {
        clearVideo();
        return;
      }
      video.loop = data.mode === 'loop';
      video.muted = !opts.audio;
      video.src = '/videos/' + data.uid;
      const pending = video.play();
      if (pending && pending.catch) pending.catch(function () {});
    } catch (error) { /* el próximo poll reintenta */ }
  }

  video.addEventListener('loadedmetadata', fit);
  window.addEventListener('resize', fit);
  setInterval(poll, 2000);
  poll();
</script>
</body>
</html>
