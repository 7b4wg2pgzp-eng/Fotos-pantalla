name: Album delivery tests

on:
  push:
    branches: [main]
    paths:
      - "gallery.py"
      - "delivery.py"
      - "album_app.py"
      - "templates/gallery.html"
      - "static/gallery.css"
      - "tests/test_album_*.py"
      - "tests/test_event_closure.py"
      - "ops/deploy_album.sh"
      - "event_source.py"
      - "app.py"
      - "tests/test_event_closure.py"
      - ".github/workflows/album-tests.yml"
  pull_request:
    paths:
      - "gallery.py"
      - "delivery.py"
      - "album_app.py"
      - "templates/gallery.html"
      - "static/gallery.css"
      - "tests/test_album_*.py"
      - "requirements-album.txt"
      - "ops/deploy_album.sh"
      - ".github/workflows/album-tests.yml"

jobs:
  album:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install album requirements
        run: python -m pip install -r requirements-album.txt
      - name: Validate VPS deployment script
        run: bash -n ops/deploy_album.sh
      - name: Compile Python modules
        run: python -m compileall -q gallery.py delivery.py album_app.py app.py event_source.py
      - name: Test album routes and media
        run: python -m unittest discover -v -s tests -p 'test_*.py'
